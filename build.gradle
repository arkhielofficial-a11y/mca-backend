plugins {
    id "fabric-loom" version "0.12-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Java-WebSocket is bundled into the final mod JAR for a self-contained client.
    modImplementation "org.java-websocket:Java-WebSocket:${project.websocket_version}"
    include "org.java-websocket:Java-WebSocket:${project.websocket_version}"

    // Java-WebSocket needs slf4j at runtime, and Minecraft 1.16.5 does not ship it.
    modImplementation "org.slf4j:slf4j-api:1.7.36"
    include "org.slf4j:slf4j-api:1.7.36"
    // No-op binding so slf4j does not warn about a missing provider.
    modImplementation "org.slf4j:slf4j-nop:1.7.36"
    include "org.slf4j:slf4j-nop:1.7.36"
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": project.minecraft_version
        )
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
